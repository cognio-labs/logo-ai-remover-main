<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Center subtle semi-transparent watermark -->
  <g transform="rotate(-15 960 540)" filter="url(#shadow)">
    <!-- Top line watermark -->
    <text x="960" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="14" fill="rgba(255, 255, 255, 0.22)">
      PREVIEW ONLY • GEMINI AI ENGINE
    </text>

    <!-- Main Center Watermark -->
    <rect x="520" y="500" width="880" height="80" rx="14" fill="rgba(0, 0, 0, 0.15)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="960" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="rgba(255, 255, 255, 0.38)">
      AI GENERATED WATERMARK
    </text>

    <!-- Bottom line watermark -->
    <text x="960" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="12" fill="rgba(255, 255, 255, 0.20)">
      UNLICENSED SYNTHETIC MEDIA
    </text>
  </g>

  <!-- Lower-Left Gemini AI Logo Badge -->
  <g transform="translate(80, 950)" filter="url(#shadow)">
    <!-- Background Pill -->
    <rect x="0" y="0" width="280" height="66" rx="33" fill="rgba(15, 23, 42, 0.78)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Gemini 4-point Sparkle Icon -->
    <g transform="translate(38, 33)">
      <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="url(#geminiGrad)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Gemini AI Text -->
    <text x="75" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      Gemini AI
    </text>
    
    <text x="210" y="40" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">
      VIDEO
    </text>
  </g>
</svg>
